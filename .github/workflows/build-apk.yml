name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto Extract ZIP & Locate package.json
        run: |
          # 1. البحث عن أي ملف ZIP مرفوع وفك ضغطه
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "تم العثور على ملف مضغوط: $ZIP_FILE"
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted/
          fi

          # 2. البحث المباشر عن package.json داخل المشروع المرفوع أو المفكوك
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$PKG_PATH" ]; then
            echo "::error::لم يتم العثور على package.json إطلاقاً!"
            exit 1
          fi

          WORK_DIR=$(dirname "$PKG_PATH")
          echo "تم تحديد مجلد العمل الرئيسي: $WORK_DIR"
          
          # حفظ المسار للاستخدام في الخطوات التالية
          echo "PROJECT_DIR=$WORK_DIR" >> $GITHUB_ENV

      - name: Install & Build Web App
        run: |
          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps
          npm run build --if-present

      - name: Sync Capacitor
        run: |
          cd "$PROJECT_DIR"
          if [ -f "capacitor.config.json" ] || [ -f "capacitor.config.ts" ]; then
            npx cap sync android || true
          fi

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          if [ -d "android" ]; then
            cd android
            if [ ! -f "gradlew" ]; then
              gradle wrapper --gradle-version 8.5
            fi
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "::error::لم يتم العثور على مجلد android داخل $PROJECT_DIR"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
