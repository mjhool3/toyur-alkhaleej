name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Project Dynamically
        run: |
          # البحث الشامل عن مكان package.json
          TARGET_FILE=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$TARGET_FILE" ]; then
            echo "::error::لم يتم العثور على package.json! طباعة شجرة الملفات:"
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi

          # الانتقال للمجلد الصحيح
          TARGET_DIR=$(dirname "$TARGET_FILE")
          echo "تم العثور على المشروع في: $TARGET_DIR"
          cd "$TARGET_DIR"

          # تثبيت الحزم وبناء الويب
          npm install --legacy-peer-deps
          npm run build --if-present

          # مزامنة كاباسيتور إن وجد
          if [ -f "capacitor.config.json" ] || [ -f "capacitor.config.ts" ]; then
            npx cap sync android || true
          fi

          # بناء الأندرويد
          if [ -d "android" ]; then
            cd android
            if [ ! -f "gradlew" ]; then
              gradle wrapper --gradle-version 8.5
            fi
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "::error::لم يتم العثور على مجلد android داخل $TARGET_DIR!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
