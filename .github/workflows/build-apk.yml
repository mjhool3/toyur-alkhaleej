name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Project from repo-root
        run: |
          # الدخول لمجلد repo-root
          cd repo-root

          # إذا كان هناك مجلد makashat بالداخل ندخل عليه، وإلا نبقى في repo-root
          if [ -d "makashat" ]; then
            cd makashat
          fi

          echo "المجلد الحالي للبناء هو: $(pwd)"

          # تثبيت الحزم وبناء الويب
          npm install --legacy-peer-deps
          npm run build --if-present

          # مزامنة كاباسيتور
          if [ -f "capacitor.config.json" ] || [ -f "capacitor.config.ts" ]; then
            npx cap sync android || true
          fi

          # بناء الأندرويد
          if [ -d "android" ]; then
            cd android
            if [ ! -f "gradlew" ]; then
              gradle wrapper --gradle-version 8.5
            fi
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "::error::لم يتم العثور على مجلد android!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
