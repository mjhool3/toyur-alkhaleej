name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto Extract ZIP & Locate package.json
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted/
          fi

          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "::error::لم يتم العثور على package.json!"
            exit 1
          fi

          WORK_DIR=$(dirname "$PKG_PATH")
          echo "PROJECT_DIR=$WORK_DIR" >> $GITHUB_ENV

      - name: Install & Build Web App
        run: |
          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps
          npx vite build || npm run build --if-present

      - name: Add Android Platform if Missing
        run: |
          cd "$PROJECT_DIR"
          # تثبيت مكتبات capacitor الرسمية إن لم تكن موجودة
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          
          # تهيئة capacitor إذا لم يتم تهيئته سابقاً
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Makashat" "com.makashat.app" --web-dir "dist"
          fi

          # إنشاء مجلد android إذا كان غير موجود
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # مزامنة الملفات المبنية مع مجلد الأندرويد
          npx cap sync android

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR/android"
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
