name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto Detect Directory & Build APK
        run: |
          # البحث عن ملف package.json في المستودع
          PKG_FILE=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$PKG_FILE" ]; then
            echo "::error::لم يتم العثور على package.json في أي مكان داخل المستودع!"
            echo "محتويات المستودع حالياً هي:"
            ls -la
            exit 1
          fi

          TARGET_DIR=$(dirname "$PKG_FILE")
          echo "تم العثور على مشروع Node في: $TARGET_DIR"
          cd "$TARGET_DIR"

          # تثبيت الحزم وبناء مشروع الويب
          npm install --legacy-peer-deps
          npm run build --if-present

          # مزامنة كاباسيتور
          if [ -f "capacitor.config.json" ] || [ -f "capacitor.config.ts" ]; then
            npx cap sync android || true
          fi

          # الانتقال لمجلد الأندرويد والبناء
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "::error::لم يتم العثور على مجلد android داخل $TARGET_DIR"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
